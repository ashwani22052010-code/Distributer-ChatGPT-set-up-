name: Render one video

on:
  workflow_call:
    inputs:
      script:
        type: string
        required: true
      fps:
        type: string
        default: "30"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          PIP_DEFAULT_TIMEOUT: 100
        run: |
          sudo apt-get remove -y needrestart || true
          sudo apt-get update -qq
          sudo apt-get install -yq --no-install-recommends ffmpeg fonts-roboto fonts-noto-core fonts-noto-color-emoji
          pip install playwright numpy
          playwright install chromium
          sudo playwright install-deps chromium
      - name: Plan (kitne hisse banenge)
        id: p
        run: python3 render.py "scripts/${{ inputs.script }}.txt" --plan plan --fps "${{ inputs.fps }}"
      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.script }}
          path: plan/
          retention-days: 2

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          PIP_DEFAULT_TIMEOUT: 100
        run: |
          sudo apt-get remove -y needrestart || true
          sudo apt-get update -qq
          sudo apt-get install -yq --no-install-recommends ffmpeg fonts-roboto fonts-noto-core fonts-noto-color-emoji
          pip install playwright numpy
          playwright install chromium
          sudo playwright install-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: plan-${{ inputs.script }}
          path: plan
      - name: Render hissa ${{ matrix.part }}
        run: python3 render.py "scripts/${{ inputs.script }}.txt" --part ${{ matrix.part }} --plan-dir plan --out out --fps "${{ inputs.fps }}"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ inputs.script }}-${{ matrix.part }}
          path: out/*.mp4
          retention-days: 2
          compression-level: 0

  merge:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          PIP_DEFAULT_TIMEOUT: 100
        run: |
          sudo apt-get remove -y needrestart || true
          sudo apt-get update -qq
          sudo apt-get install -yq --no-install-recommends ffmpeg
          pip install numpy
      - uses: actions/download-artifact@v4
        with:
          name: plan-${{ inputs.script }}
          path: plan
      - uses: actions/download-artifact@v4
        with:
          pattern: part-${{ inputs.script }}-*
          path: parts
          merge-multiple: true
      - name: Jodo + audio
        run: python3 render.py "scripts/${{ inputs.script }}.txt" --merge --plan-dir plan --parts-dir parts --out out --fps "${{ inputs.fps }}"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.script }}
          path: out/*.mp4
          retention-days: 7
          compression-level: 0
          
