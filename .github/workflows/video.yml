name: Render one video

on:
  workflow_call:
    inputs:
      script:
        type: string
        required: true
      fps:
        type: string
        default: "30"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          PIP_DEFAULT_TIMEOUT: 120
        run: |
          sudo tee /etc/apt/apt.conf.d/99net >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources || true
          for i in 1 2 3; do
            sudo timeout 60 apt-get update -qq \
              && sudo timeout 240 apt-get install -y --no-install-recommends ffmpeg \
              && break
            echo "apt retry $i"; sleep 5
          done
          command -v ffmpeg
          for i in 1 2 3; do
            timeout 300 pip install --no-cache-dir playwright numpy && break
            sleep 5
          done
          for i in 1 2 3; do
            timeout 300 python3 -m playwright install chromium && break
            sleep 5
          done
      - name: Plan (kitne hisse banenge)
        id: p
        run: python3 render.py "scripts/${{ inputs.script }}.txt" --plan plan --fps "${{ inputs.fps }}"
      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.script }}
          path: plan/
          retention-days: 2

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          PIP_DEFAULT_TIMEOUT: 120
        run: |
          sudo tee /etc/apt/apt.conf.d/99net >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources || true
          for i in 1 2 3; do
            sudo timeout 60 apt-get update -qq \
              && sudo timeout 240 apt-get install -y --no-install-recommends ffmpeg \
              && break
            echo "apt retry $i"; sleep 5
          done
          command -v ffmpeg
          for i in 1 2 3; do
            timeout 300 pip install --no-cache-dir playwright numpy && break
            sleep 5
          done
          for i in 1 2 3; do
            timeout 300 python3 -m playwright install chromium && break
            sleep 5
          done
      - uses: actions/download-artifact@v4
        with:
          name: plan-${{ inputs.script }}
          path: plan
      - name: Render hissa ${{ matrix.part }}
        run: python3 render.py "scripts/${{ inputs.script }}.txt" --part ${{ matrix.part }} --plan-dir plan --out out --fps "${{ inputs.fps }}"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ inputs.script }}-${{ matrix.part }}
          path: out/*.mp4
          retention-days: 2
          compression-level: 0

  merge:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          PIP_DEFAULT_TIMEOUT: 120
        run: |
          sudo tee /etc/apt/apt.conf.d/99net >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources || true
          for i in 1 2 3; do
            sudo timeout 60 apt-get update -qq \
              && sudo timeout 240 apt-get install -y --no-install-recommends ffmpeg \
              && break
            echo "apt retry $i"; sleep 5
          done
          command -v ffmpeg
          for i in 1 2 3; do
            timeout 300 pip install --no-cache-dir numpy && break
            sleep 5
          done
      - uses: actions/download-artifact@v4
        with:
          name: plan-${{ inputs.script }}
          path: plan
      - uses: actions/download-artifact@v4
        with:
          pattern: part-${{ inputs.script }}-*
          path: parts
          merge-multiple: true
      - name: Jodo + audio
        run: python3 render.py "scripts/${{ inputs.script }}.txt" --merge --plan-dir plan --parts-dir parts --out out --fps "${{ inputs.fps }}"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.script }}
          path: out/*.mp4
          retention-days: 7
          compression-level: 0
