name: Render videos

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Sirf ek script render karni ho to naam likho (jaise video1). Khali = sab"
        required: false
        default: ""
      fps:
        description: "FPS (30 normal, 60 extra smooth but 2x slow)"
        required: false
        default: "30"
  push:
    paths:
      - "scripts/**"

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ONLY: ${{ inputs.only }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess, glob
          allf = sorted(glob.glob("scripts/*.txt"))
          sel = allf
          if os.environ["EVENT"] == "workflow_dispatch":
              only = os.environ.get("ONLY", "").strip()
              if only:
                  sel = [f for f in allf if os.path.basename(f)[:-4] == only]
          else:
              try:
                  out = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=AM",
                                                 os.environ["BEFORE"], "HEAD", "--", "scripts"], text=True).split("\n")
                  sel = [f for f in out if f.endswith(".txt") and os.path.exists(f)]
              except Exception:
                  sel = allf
          names = [os.path.basename(f)[:-4] for f in sel]
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write("matrix=" + json.dumps(names) + "\n")
              o.write("count=" + str(len(names)) + "\n")
          print("Render hone wali scripts:", names)
          PY

  video:
    needs: list
    if: needs.list.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        script: ${{ fromJson(needs.list.outputs.matrix) }}
    uses: ./.github/workflows/video.yml
    with:
      script: ${{ matrix.script }}
      fps: ${{ inputs.fps || '30' }}

  publish:
    needs: video
    if: ${{ !cancelled() && needs.video.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: videos
          pattern: video-*
          merge-multiple: true

      - name: Upload to GitHub Release & Save Link
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: "v-${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          echo "GitHub Release me video daal rahe hain..."
          
          gh release create "$TAG_NAME" videos/*.mp4 --repo "$GITHUB_REPOSITORY" --title "Rendered Videos $TAG_NAME" --notes "Auto-generated by Editor App"
          
          python3 - <<EOF
          import os, glob
          
          tag_name = os.environ.get("TAG_NAME")
          repo = "${{ github.repository }}"
          
          videos = glob.glob("videos/job_*.mp4")
          for vid in videos:
              job_id = os.path.basename(vid).split(".")[0]
              filename = os.path.basename(vid)
              
              direct_link = f"https://github.com/{repo}/releases/download/{tag_name}/{filename}"
              
              with open("links.txt", "a") as f:
                  f.write(f"{job_id},{direct_link}\n")
                  
              print(f"✅ Link Generated: {direct_link}")
          EOF
          
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git pull || true
          git add links.txt
          git commit -m "Added GitHub Release video link" || true
          git push
          
