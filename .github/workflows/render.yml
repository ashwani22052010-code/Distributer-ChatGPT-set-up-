name: Render videos

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Sirf ek script render karni ho to naam likho (jaise video1). Khali = sab"
        required: false
        default: ""
      fps:
        description: "FPS (30 normal, 60 extra smooth but 2x slow)"
        required: false
        default: "30"
  push:
    paths:
      - "scripts/**"

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ONLY: ${{ inputs.only }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess, glob
          allf = sorted(glob.glob("scripts/*.txt"))
          sel = allf
          if os.environ["EVENT"] == "workflow_dispatch":
              only = os.environ.get("ONLY", "").strip()
              if only:
                  sel = [f for f in allf if os.path.basename(f)[:-4] == only]
          else:
              try:
                  out = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=AM",
                                                 os.environ["BEFORE"], "HEAD", "--", "scripts"], text=True).split("\n")
                  sel = [f for f in out if f.endswith(".txt") and os.path.exists(f)]
              except Exception:
                  sel = allf
          names = [os.path.basename(f)[:-4] for f in sel]
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write("matrix=" + json.dumps(names) + "\n")
              o.write("count=" + str(len(names)) + "\n")
          print("Render hone wali scripts:", names)
          PY

  video:
    needs: list
    if: needs.list.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        script: ${{ fromJson(needs.list.outputs.matrix) }}
    uses: ./.github/workflows/video.yml
    with:
      script: ${{ matrix.script }}
      fps: ${{ inputs.fps || '30' }}

  publish:
    needs: video
    if: ${{ !cancelled() && needs.video.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: videos
          pattern: video-*
          merge-multiple: true

      - name: Send Clean Video Download Link
        run: |
          pip install requests
          python3 - <<'EOF'
          import os, glob, requests
          
          videos = glob.glob("videos/job_*.mp4")
          if not videos:
              print("Koi nayi video nahi mili!")
              exit(0)
              
          for vid in videos:
              job_id = os.path.basename(vid).split(".")[0]
              
              print(f"Uploading {vid}...")
              direct_link = ""
              
              # Plan A: Catbox (100% Ad-Free, Direct MP4)
              try:
                  print("Try 1: Uploading to Catbox...")
                  with open(vid, 'rb') as f:
                      res = requests.post("https://catbox.moe/user/api.php", data={"reqtype": "fileupload"}, files={"fileToUpload": f})
                  if res.status_code == 200 and res.text.startswith("http"):
                      direct_link = res.text.strip()
                      print(f"✅ Catbox Success: {direct_link}")
              except Exception as e:
                  print("❌ Catbox failed:", e)
                  
              # Plan B: Uguu (Agar Catbox down ho - Ye bhi Ad-Free hai)
              if not direct_link:
                  try:
                      print("Try 2: Uploading to Uguu.se...")
                      with open(vid, 'rb') as f:
                          res = requests.post("https://uguu.se/api.php?d=upload-tool", files={"file": (os.path.basename(vid), f)})
                      data = res.json()
                      if data.get("success"):
                          direct_link = data["files"][0]["url"]
                          print(f"✅ Uguu Success: {direct_link}")
                  except Exception as e:
                      print("❌ Uguu failed:", e)

              # Link save karna
              if direct_link:
                  with open("links.txt", "a") as f:
                      f.write(f"{job_id},{direct_link}\n")
                  print("🎉 Link links.txt me save ho gaya!")
              else:
                  print("⚠️ Upload dono server par fail ho gaya. File size zyada ho sakti hai.")
          EOF
          
          # GitHub me changes save karna
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git pull origin main || true
          git add links.txt || true
          git commit -m "Added solid video link" || echo "No changes"
          git push origin HEAD:main
          
