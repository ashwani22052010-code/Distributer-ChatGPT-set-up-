name: Render videos

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Sirf ek script render karni ho to naam likho (jaise video1). Khali = sab"
        required: false
        default: ""
      fps:
        description: "FPS (30 normal, 60 extra smooth but 2x slow)"
        required: false
        default: "30"
  push:
    paths:
      - "scripts/**"

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ONLY: ${{ inputs.only }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess, glob
          allf = sorted(glob.glob("scripts/*.txt"))
          sel = allf
          if os.environ["EVENT"] == "workflow_dispatch":
              only = os.environ.get("ONLY", "").strip()
              if only:
                  sel = [f for f in allf if os.path.basename(f)[:-4] == only]
          else:
              try:
                  out = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=AM",
                                                 os.environ["BEFORE"], "HEAD", "--", "scripts"], text=True).split("\n")
                  sel = [f for f in out if f.endswith(".txt") and os.path.exists(f)]
              except Exception:
                  sel = allf
          names = [os.path.basename(f)[:-4] for f in sel]
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write("matrix=" + json.dumps(names) + "\n")
              o.write("count=" + str(len(names)) + "\n")
          print("Render hone wali scripts:", names)
          PY

  video:
    needs: list
    if: needs.list.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        script: ${{ fromJson(needs.list.outputs.matrix) }}
    uses: ./.github/workflows/video.yml
    with:
      script: ${{ matrix.script }}
      fps: ${{ inputs.fps || '30' }}

  publish:
    needs: video
    if: ${{ !cancelled() && needs.video.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: videos
          pattern: video-*
          merge-multiple: true
          
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh videos
          gh release create "videos-${{ github.run_number }}" videos/*.mp4 \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "Videos - run ${{ github.run_number }}" \
            --notes "Rendered 4K videos"

      - name: Send Video Download Link to Editor App
        run: |
          python3 - <<'EOF'
          import os, glob, json, urllib.request, subprocess
          
          videos = glob.glob("videos/job_*.mp4")
          if not videos:
              print("Koi nayi editor video nahi mili!")
              exit(0)
              
          for vid in videos:
              job_id = os.path.basename(vid).split(".")[0]
              print(f"Uploading {vid} for Editor App...")
              
              try:
                  # Super-fast server par upload
                  cmd = ["curl", "-s", "-F", f"file=@{vid}", "https://tmpfiles.org/api/v1/upload"]
                  out = subprocess.check_output(cmd).decode("utf-8")
                  link = json.loads(out)["data"]["url"]
                  
                  # Direct download link generate karna
                  direct_link = link.replace("tmpfiles.org/", "tmpfiles.org/dl/")
                  print(f"Link Generated: {direct_link}")
                  
                  # Firebase me push karna
                  fb_url = f"https://ashwani-chatgpt-default-rtdb.firebaseio.com/editorJobs/{job_id}/downloadUrl.json"
                  req = urllib.request.Request(fb_url, data=json.dumps(direct_link).encode(), method="PUT")
                  with urllib.request.urlopen(req) as res:
                      print("✅ Firebase Success:", res.read().decode())
                      
              except Exception as e:
                  print("❌ Error aaya:", e)
          EOF
          
