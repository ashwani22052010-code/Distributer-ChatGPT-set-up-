<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChatGPT Chat Simulator</title>
<style>
:root{--bg:#070b0f;--pill:#171b21;--line:#2a2f37;--txt:#f2f4f6;--mut:#6f757e;--ic:#8d939c;--pn:#10141a;--pl:#232932;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);aspect-ratio:16/9;background:var(--bg);overflow:hidden;container-type:inline-size}

/* Camera sliding transform transition added */
#world{position:absolute;inset:0;transform-origin:var(--ox,50%) var(--oy,50%);transform:scale(var(--z,1));transition:transform .9s cubic-bezier(.65,0,.35,1), transform-origin .3s ease-out}

#msg{position:absolute;left:5cqw;top:17cqw;font-family:"Segoe UI","Segoe UI Emoji","Noto Color Emoji",system-ui,sans-serif;font-size:2.15cqw;line-height:1.35;transition:opacity .25s;max-width:88cqw}
#reply{white-space:pre-wrap;font-weight:400;min-height:1.35em}
.dot{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:#cfd3d8;vertical-align:middle;margin-left:.12em}
.dot.load{animation:pl 1s ease-in-out infinite;margin-left:0}
@keyframes pl{50%{transform:scale(1.5);opacity:.6}}
#acts{display:flex;gap:1.1em;margin-top:.55em;margin-left:-.45em;opacity:0;transition:opacity .35s}
#acts.on{opacity:1}
#acts svg{width:1em;height:1em;margin:.45em .45em;stroke:var(--ic);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#note{position:absolute;left:0;right:0;top:32.3cqw;text-align:center;font-size:1.05cqw;color:var(--mut);font-family:"Segoe UI",system-ui,sans-serif}

/* Original pill sizing exactly as requested, replaced height with min-height */
#pill{position:absolute;left:6cqw;right:6cqw;top:35.6cqw;min-height:7cqw;border-radius:3.5cqw;background:var(--pill);border:.1cqw solid var(--line);display:flex;align-items:center;font-family:Arial,Helvetica,sans-serif;font-size:1.75cqw;padding:0 2cqw 0 1.5em}
#plus{width:1.2em;height:1.2em;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;flex:none}

/* Display flex to block kiya gaya taaki caret text ke saath left side wapas wrap ho sake */
/* FIX 2: text-align:left add kiya -> wrapped second line first line ke exact start se hi shuru hogi */
#field{flex:1 1 0;width:0;margin-left:1.2em;position:relative;display:block;min-width:0;color:#d8dbe0;white-space:normal!important;overflow-wrap:anywhere;word-break:normal;max-height:22cqw;overflow-x:hidden;overflow-y:auto;line-height:1.4;text-align:left!important;text-align-last:left;text-indent:0!important;padding:0!important;direction:ltr;unicode-bidi:normal;-webkit-text-size-adjust:100%;text-size-adjust:100%;hanging-punctuation:none}
#it{display:inline;text-indent:0!important;white-space:inherit;margin:0;padding:0}
/* FIX 1: placeholder ab absolute nahi, normal flow me caret ke baad -> caret "A" ke left dikhta hai */
#ph{color:#7a8089}
#caret{display:inline-block;width:.09em;height:1.25em;background:#fff;margin-left:.05em;animation:bl 1s steps(1) infinite;vertical-align:middle;margin-bottom:0.1em}
#field.typing #caret{animation:none}
@keyframes bl{50%{opacity:0}}
.rt{display:flex;align-items:center;gap:1.3em;flex:none;color:#e9ecef}
.think{display:flex;align-items:center;gap:.4em;font-weight:600;font-size:.95em}
.think svg,.mic{width:1.2em;height:1.2em;stroke:#e9ecef;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#send{display:none;width:2.1em;height:2.1em;border-radius:50%;background:#fff;align-items:center;justify-content:center}
#send svg{width:1.1em;height:1.1em;stroke:#000;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
#send.on{display:flex}#send.on~.mic{display:none}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);background:var(--pn);border-left:1px solid var(--pl);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto;z-index:5;transition:transform .25s;font-size:14px}
#panel.hide{transform:translateX(100%)}
#panel h1{font-size:16px;margin:0 0 4px}
#panel p{margin:0 0 10px;color:#9aa1ab;font-size:12.5px;line-height:1.4}
textarea{width:100%;height:210px;background:#0a0d11;color:#e6e9ee;border:1px solid var(--pl);border-radius:8px;padding:10px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.row{display:flex;gap:8px;margin:10px 0}
button{flex:1;background:#232932;color:#fff;border:1px solid #333b46;border-radius:8px;padding:10px 6px;font-size:14px;cursor:pointer}
button.pr{background:#fff;color:#000;border-color:#fff;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #6ea8ff;outline-offset:2px}
label.s{display:block;margin:10px 0 2px;color:#c3c8d0;font-size:12.5px}
label.s b{float:right;font-weight:500;color:#8f96a0}
input[type=range]{width:100%}
label.c{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px}
#st{color:#8f96a0;font-size:12.5px;margin:6px 0}
#tg{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:6;width:auto;flex:none;padding:6px 10px;font-size:12px;opacity:.55}
#tg:hover{opacity:1}
@media (prefers-reduced-motion:reduce){.dot.load{animation:none}}
</style></head><body>
<div id="stage"><div id="world">
 <div id="msg"><div id="reply"></div>
  <div id="acts"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg><svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M4 14v4.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V14"/></svg><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4.5L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4.5L20 15M20 20v-5h-5"/></svg><svg viewBox="0 0 24 24" style="fill:var(--ic);stroke:none"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></div></div>
 <div id="note">ChatGPT can make mistakes. Check important info.</div>
 <div id="pill"><svg id="plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>
  <!-- FIX 1: order badla -> it, caret, ph (taaki khali box me caret "A" ke left ho) -->
  <div id="field"><span id="it"></span><span id="caret"></span><span id="ph">Ask anything</span></div>
  <div class="rt"><div class="think"><svg viewBox="0 0 24 24"><path d="M12 5v15M9 4.5A3.5 3.5 0 0 0 5.5 8a3 3 0 0 0-1.5 5 3.3 3.3 0 0 0 2 4.7A3 3 0 0 0 12 19M15 4.5A3.5 3.5 0 0 1 18.5 8a3 3 0 0 1 1.5 5 3.3 3.3 0 0 1-2 4.7A3 3 0 0 1 12 19M8.5 10c1.3 0 2.5-.8 3.5-2M15.5 10c-1.3 0-2.5-.8-3.5-2"/></svg>Think</div>
  <div id="send"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></div>
  <svg class="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></div></div>
</div></div>

<button id="tg" aria-expanded="true">Hide panel</button>
<aside id="panel">
 <h1>ChatGPT Chat Simulator</h1>
 <p>Script paste karo (format: <b>User:</b> / <b>ChatGPT:</b>), Load dabao, phir Play. Recording ke liye panel hide karo (P key).</p>
 <textarea id="src" spellcheck="false" aria-label="Script"></textarea>
 <div class="row"><button id="load">Load script</button><button id="play" class="pr">Play</button></div>
 <div class="row"><button id="pause">Pause</button><button id="rst">Restart</button></div>
 <div id="st">0 messages loaded</div>
 <label class="s">Typing speed (ms/char)<b id="v1"></b></label><input type="range" id="ts" min="20" max="220" value="85">
 <label class="s">Reply speed (ms/char)<b id="v2"></b></label><input type="range" id="rs" min="8" max="120" value="26">
 <label class="s">Thinking dot before reply (ms)<b id="v3"></b></label><input type="range" id="th" min="200" max="3500" step="100" value="900">
 <label class="s">Pause after reply (ms)<b id="v4"></b></label><input type="range" id="hd" min="300" max="5000" step="100" value="1400">
 <label class="c"><input type="checkbox" id="snd" checked> Typing sound</label>
 <label class="c"><input type="checkbox" id="zm" checked> Camera zoom (like the video)</label>
</aside>

<script>
const $=s=>document.querySelector(s);
const DEF=`User: Hey ChatGPT. 👀
ChatGPT: Hey! What's up? 😀
User: This is a really really long test message to check if the camera sliding and box stretching is working properly right now, and if it wraps back to the left side smoothly!
ChatGPT: Okay, I'm ready. 🤓`;
let store=null;try{store=localStorage.getItem('gptsim.script')}catch(e){}
$('#src').value=store||DEF;
const world=$('#world'),reply=$('#reply'),acts=$('#acts'),msgEl=$('#msg'),it=$('#it'),ph=$('#ph'),field=$('#field'),send=$('#send');
let msgs=[],run=0,paused=false,audio=null;
const Z={wide:['1','50%','50%'],type:['2.3','4%','72%'],reply:['2.05','3%','34%']};
function zoom(k){if(!$('#zm').checked)k='wide';const z=Z[k];world.style.setProperty('--z',z[0]);world.style.setProperty('--ox',z[1]);world.style.setProperty('--oy',z[2])}
const LEAD=/^[\s\u00A0\u00AD\u115F\u1160\u180E\u200B-\u200F\u2028\u2029\u202A-\u202E\u2060-\u206F\u3164\uFEFF\uFFA0]+/;
const clean=t=>t.replace(LEAD,'').replace(/\n[ \t\u00A0\u200B-\u200F\u2060\u3164\uFEFF\uFFA0]+/g,'\n');
function parse(t){const o=[];t.split(/\r?\n/).forEach(l=>{const m=l.match(/^\s*(user|you|chatgpt|gpt|ai|assistant)\s*:\s*(.*)$/i);
 if(m)o.push({r:/^(user|you)$/i.test(m[1])?'u':'g',t:clean(m[2])});else if(l.trim()&&o.length)o[o.length-1].t+='\n'+l.trim()});return o}
function load(){msgs=parse($('#src').value);$('#st').textContent=msgs.length+' messages loaded';try{localStorage.setItem('gptsim.script',$('#src').value)}catch(e){}}
const G=t=>window.Intl&&Intl.Segmenter?Array.from(new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(t),s=>s.segment):Array.from(t);
let cur=0;
const sleep=async ms=>{const e=performance.now()+ms;while(performance.now()<e){await new Promise(r=>setTimeout(r,16));while(paused){await new Promise(r=>setTimeout(r,60));if(cur!==run)throw 0}if(cur!==run)throw 0}};
function click(){if(!$('#snd').checked||!audio)return;const n=520,b=audio.createBuffer(1,n,44100),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,5)*.5;const s=audio.createBufferSource(),g=audio.createGain();g.gain.value=.55;s.buffer=b;s.connect(g);g.connect(audio.destination);s.start()}

function setInput(t){
  t=clean(t);it.innerHTML=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  ph.style.display=t?'none':'';
  send.classList.toggle('on',!!t);
  field.classList.toggle('typing',!!t);
  
  // Camera Pan tracking dynamically
  if ($('#zm').checked && world.style.getPropertyValue('--z') === '2.3') {
    const cx = $('#caret').offsetLeft;
    const fw = field.clientWidth || 1;
    
    // NAYA SYSTEM: 45% field width tak camera ekdum lock rahega
    const safeZone = fw * 0.45; 
    let progress = 0;
    
    // Jab text safe zone cross karega (frame se bahar jane lagega), tabhi slide hoga
    if (cx > safeZone) {
      progress = Math.min(1, (cx - safeZone) / (fw - safeZone));
    }
    
    // Line wrap hone par progress wapas 0 ho jayega aur camera left aa jayega
    world.style.setProperty('--ox', (4 + progress * 68) + '%');
  }
}

function resetUI(){reply.innerHTML='';acts.classList.remove('on');msgEl.style.opacity=1;setInput('');zoom('wide')}
async function userTurn(t){
 msgEl.style.opacity=0;await sleep(260);reply.innerHTML='';acts.classList.remove('on');
 zoom('type');await sleep(700);
 const c=G(t);let s='';const ts=+$('#ts').value;
 for(const ch of c){s+=ch;setInput(s);if(ch.trim())click();let d=ts*(.6+Math.random()*.8);if(/[.,!?]/.test(ch))d*=2.2;await sleep(d)}
 await sleep(450);setInput('');await sleep(150)}
async function gptTurn(t){
 reply.innerHTML='<span id="rt"></span><span class="dot load" id="rd"></span>';msgEl.style.opacity=1;zoom('reply');
 await sleep(+$('#th').value);
 const rt=$('#rt'),rd=$('#rd');rd.classList.remove('load');const rs=+$('#rs').value;let s='';
 for(const ch of G(t)){s+=ch;rt.textContent=s;await sleep(rs*(.5+Math.random()))}
 rd.remove();acts.classList.add('on');await sleep(+$('#hd').value+t.length*20)}
async function play(){
 if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
 if(audio&&audio.state==='suspended')audio.resume();
   load();if(!msgs.length)return;
 run++;cur=run;paused=false;$('#pause').textContent='Pause';resetUI();
 try{await sleep(500);for(const m of msgs){m.r==='u'?await userTurn(m.t):await gptTurn(m.t)}await sleep(600);zoom('wide')}catch(e){}}
$('#play').onclick=play;
$('#load').onclick=load;
$('#rst').onclick=()=>{run++;cur=run;paused=false;$('#pause').textContent='Pause';resetUI()};
$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'Resume':'Pause'};
const tg=$('#tg'),pn=$('#panel');
function tgl(){pn.classList.toggle('hide');const h=pn.classList.contains('hide');tg.textContent=h?'Show panel':'Hide panel';tg.setAttribute('aria-expanded',!h)}
tg.onclick=tgl;
addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='p'||e.key==='P')tgl();if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();$('#pause').click()}});
[['ts','v1'],['rs','v2'],['th','v3'],['hd','v4']].forEach(([a,b])=>{const f=()=>$('#'+b).textContent=$('#'+a).value;$('#'+a).oninput=f;f()});
load();
</script></body></html>
