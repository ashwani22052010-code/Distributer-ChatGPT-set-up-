<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gemini Chat Simulator</title>
<style>
:root{--bg:#0f0f0f;--pill:#1e1f21;--txt:#f2f2f2;--mut:#d4d4d4;--ic:#ececec;--pn:#10141a;--pl:#232932;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:var(--txt);font-family:"Google Sans","Product Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);aspect-ratio:16/9;background:var(--bg);overflow:hidden;container-type:inline-size}
#world{position:absolute;inset:0;transform-origin:var(--ox,50%) var(--oy,50%);transform:scale(var(--z,1));transition:transform .9s cubic-bezier(.65,0,.35,1), transform-origin .3s ease-out}

#msg{position:absolute;left:5cqw;top:15cqw;font-family:"Google Sans","Product Sans",Roboto,"Noto Sans","Noto Sans Devanagari",system-ui,sans-serif;font-size:2.2cqw;line-height:1.55;transition:opacity .25s;max-width:88cqw}
#reply{white-space:pre-wrap;font-weight:400;min-height:1.55em}
/* Gemini loading: 3 dots, horizontal floating wave */
.gd{display:inline-flex;align-items:center;gap:.42em;height:1.55em;padding-left:.15em}
.gd i{display:block;width:.5em;height:.5em;border-radius:50%;animation:gw 1.15s ease-in-out infinite}
.gd i:nth-child(1){background:#ffffff;animation-delay:0s}
.gd i:nth-child(2){background:#ffffff;animation-delay:.16s}
.gd i:nth-child(3){background:#ffffff;animation-delay:.32s}
@keyframes gw{0%,55%,100%{transform:translateY(0);opacity:.75}27%{transform:translateY(-.5em);opacity:1}}
#acts{display:flex;gap:0;margin-top:.5em;margin-left:-.4em;opacity:0;transition:opacity .35s}
#acts.on{opacity:1}
#acts svg{width:1em;height:1em;margin:.4em .4em;stroke:var(--ic);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* input box + disclaimer niche (Gemini style) */
#dock{position:absolute;left:6cqw;right:6cqw;top:34cqw}
#pill{min-height:8.5cqw;border-radius:4.25cqw;background:var(--pill);display:flex;align-items:center;font-family:"Google Sans","Product Sans",Roboto,"Noto Sans","Noto Sans Devanagari",Arial,sans-serif;font-size:2.4cqw;padding:.55cqw 2.2cqw .55cqw 3.6cqw}
#plus{width:.95em;height:.95em;stroke:#eee;stroke-width:1.7;fill:none;stroke-linecap:round;flex:none}
#field{flex:1 1 0;width:0;margin-left:.9em;position:relative;display:block;min-width:0;color:#eff1f0;white-space:normal!important;overflow-wrap:anywhere;word-break:normal;max-height:22cqw;overflow-x:hidden;overflow-y:auto;line-height:1.4;text-align:left!important;text-align-last:left;text-indent:0!important;padding:0!important;direction:ltr;unicode-bidi:normal;-webkit-text-size-adjust:100%;text-size-adjust:100%;hanging-punctuation:none}
#it{display:inline;text-indent:0!important;white-space:inherit;margin:0;padding:0}
#ph{color:#cccdd2}
#caret{display:inline-block;width:.07em;height:1.15em;background:#fff;margin-left:.05em;animation:bl 1s steps(1) infinite;vertical-align:middle;margin-bottom:0.1em}
#field.typing #caret{animation:none}
@keyframes bl{50%{opacity:0}}
.rt{display:flex;align-items:center;flex:none;color:#eff0f2}
.flash{display:flex;align-items:center;gap:.4em;margin-right:1.7em;color:#eff0f2}
.flash svg{width:.7em;height:.7em;stroke:#d1d2d4;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic{width:1.2em;height:1.2em;stroke:#f1f1f1;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin:0 .275em}
#send{display:none;width:1.75em;height:1.75em;border-radius:50%;background:#1f3b9c;align-items:center;justify-content:center;margin-left:.6em}
#send svg{width:1.4em;height:1.4em;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
#send.on{display:flex}
#note{text-align:center;margin-top:2.2cqw;font-size:1.65cqw;color:var(--mut);font-family:"Google Sans","Product Sans",Roboto,system-ui,sans-serif}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);background:var(--pn);border-left:1px solid var(--pl);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto;z-index:5;transition:transform .25s;font-size:14px}
#panel.hide{transform:translateX(100%)}
#panel h1{font-size:16px;margin:0 0 4px}
#panel p{margin:0 0 10px;color:#9aa1ab;font-size:12.5px;line-height:1.4}
textarea{width:100%;height:210px;background:#0a0d11;color:#e6e9ee;border:1px solid var(--pl);border-radius:8px;padding:10px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.row{display:flex;gap:8px;margin:10px 0}
button{flex:1;background:#232932;color:#fff;border:1px solid #333b46;border-radius:8px;padding:10px 6px;font-size:14px;cursor:pointer}
button.pr{background:#fff;color:#000;border-color:#fff;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #6ea8ff;outline-offset:2px}
label.s{display:block;margin:10px 0 2px;color:#c3c8d0;font-size:12.5px}
label.s b{float:right;font-weight:500;color:#8f96a0}
input[type=range]{width:100%}
label.c{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px}
#st{color:#8f96a0;font-size:12.5px;margin:6px 0}
#tg{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:6;width:auto;flex:none;padding:6px 10px;font-size:12px;opacity:.55}
#tg:hover{opacity:1}
@media (prefers-reduced-motion:reduce){.gd i{animation:none}}
</style></head><body>
<div id="stage"><div id="world">
 <div id="msg"><div id="reply"></div>
  <div id="acts"><svg viewBox="0 0 24 24"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg><svg viewBox="0 0 24 24"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg><svg viewBox="0 0 24 24" style="fill:var(--ic);stroke:none"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></div></div>
 <div id="dock">
  <div id="pill"><svg id="plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>
   <div id="field"><span id="it"></span><span id="caret"></span><span id="ph">Ask Gemini</span></div>
   <div class="rt"><div class="flash">Flash<svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></div>
    <svg class="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
    <div id="send"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></div></div></div>
  <div id="note">Gemini is AI and can make mistakes.</div>
 </div>
</div></div>

<button id="tg" aria-expanded="true">Hide panel</button>
<aside id="panel">
 <h1>Gemini Chat Simulator</h1>
 <p>Script paste karo (format: <b>User:</b> / <b>Gemini:</b>), Load dabao, phir Play. Recording ke liye panel hide karo (P key).</p>
 <textarea id="src" spellcheck="false" aria-label="Script"></textarea>
 <div class="row"><button id="load">Load script</button><button id="play" class="pr">Play</button></div>
 <div class="row"><button id="pause">Pause</button><button id="rst">Restart</button></div>
 <div id="st">0 messages loaded</div>
 <label class="s">Typing speed (ms/char)<b id="v1"></b></label><input type="range" id="ts" min="20" max="220" value="85">
 <label class="s">Reply speed (ms/char)<b id="v2"></b></label><input type="range" id="rs" min="8" max="120" value="26">
 <label class="s">Thinking dot before reply (ms)<b id="v3"></b></label><input type="range" id="th" min="200" max="3500" step="100" value="900">
 <label class="s">Pause after reply (ms)<b id="v4"></b></label><input type="range" id="hd" min="300" max="5000" step="100" value="1400">
 <label class="c"><input type="checkbox" id="snd" checked> Typing sound</label>
 <label class="c"><input type="checkbox" id="zm" checked> Camera zoom (like the video)</label>
</aside>

<script>
const $=s=>document.querySelector(s);
const DEF=`User: Hey Gemini. 👀
Gemini: Hey! What's up? 😀
User: This is a really really long test message to check if the camera sliding and box stretching is working properly right now, and if it wraps back to the left side smoothly!
Gemini: Okay, I'm ready. 🤓`;
let store=null;try{store=localStorage.getItem('geminisim.script')}catch(e){}
$('#src').value=store||DEF;
const world=$('#world'),reply=$('#reply'),acts=$('#acts'),msgEl=$('#msg'),it=$('#it'),ph=$('#ph'),field=$('#field'),send=$('#send');
let msgs=[],run=0,paused=false,audio=null;
const Z={wide:['1','50%','50%'],type:['2.3','4%','68%'],reply:['2.05','3%','34%']};
function zoom(k){if(!$('#zm').checked)k='wide';const z=Z[k];world.style.setProperty('--z',z[0]);world.style.setProperty('--ox',z[1]);world.style.setProperty('--oy',z[2])}
const LEAD=/^[\s\u00A0\u00AD\u115F\u1160\u180E\u200B-\u200F\u2028\u2029\u202A-\u202E\u2060-\u206F\u3164\uFEFF\uFFA0]+/;
const clean=t=>t.replace(LEAD,'').replace(/\n[ \t\u00A0\u200B-\u200F\u2060\u3164\uFEFF\uFFA0]+/g,'\n');
function parse(t){const o=[];t.split(/\r?\n/).forEach(l=>{const m=l.match(/^\s*(user|you|gemini|chatgpt|gpt|ai|assistant)\s*:\s*(.*)$/i);
 if(m)o.push({r:/^(user|you)$/i.test(m[1])?'u':'g',t:clean(m[2])});else if(l.trim()&&o.length)o[o.length-1].t+='\n'+l.trim()});return o}
function load(){msgs=parse($('#src').value);$('#st').textContent=msgs.length+' messages loaded';try{localStorage.setItem('geminisim.script',$('#src').value)}catch(e){}}
const G=t=>window.Intl&&Intl.Segmenter?Array.from(new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(t),s=>s.segment):Array.from(t);
let cur=0;
const sleep=async ms=>{const e=performance.now()+ms;while(performance.now()<e){await new Promise(r=>setTimeout(r,16));while(paused){await new Promise(r=>setTimeout(r,60));if(cur!==run)throw 0}if(cur!==run)throw 0}};
function click(){if(!$('#snd').checked||!audio)return;const n=520,b=audio.createBuffer(1,n,44100),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,5)*.5;const s=audio.createBufferSource(),g=audio.createGain();g.gain.value=.55;s.buffer=b;s.connect(g);g.connect(audio.destination);s.start()}

function setInput(t){
  t=clean(t);it.innerHTML=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  ph.style.display=t?'none':'';
  send.classList.toggle('on',!!t);
  field.classList.toggle('typing',!!t);
  
  // Camera Pan tracking dynamically
  if ($('#zm').checked && world.style.getPropertyValue('--z') === '2.3') {
    const cx = $('#caret').offsetLeft;
    const fw = field.clientWidth || 1;
    const progress = Math.min(1, Math.max(0, cx / fw));
    
    // Now progress resets to ~0 when wrapping line, seamlessly sliding camera left
    world.style.setProperty('--ox', (4 + progress * 68) + '%');
  }
}

function resetUI(){reply.innerHTML='';acts.classList.remove('on');msgEl.style.opacity=1;setInput('');zoom('wide')}
async function userTurn(t){
 msgEl.style.opacity=0;await sleep(260);reply.innerHTML='';acts.classList.remove('on');
 zoom('type');await sleep(700);
 const c=G(t);let s='';const ts=+$('#ts').value;
 for(const ch of c){s+=ch;setInput(s);if(ch.trim())click();let d=ts*(.6+Math.random()*.8);if(/[.,!?]/.test(ch))d*=2.2;await sleep(d)}
 await sleep(450);setInput('');await sleep(150)}
async function gptTurn(t){
 reply.innerHTML='<span id="rt"></span><span class="gd" id="rd"><i></i><i></i><i></i></span>';msgEl.style.opacity=1;zoom('reply');
 await sleep(+$('#th').value);
 const rt=$('#rt'),rd=$('#rd');rd.remove();const rs=+$('#rs').value;let s='';
 for(const ch of G(t)){s+=ch;rt.textContent=s;await sleep(rs*(.5+Math.random()))}
 acts.classList.add('on');await sleep(+$('#hd').value+t.length*20)}
async function play(){
 if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
 if(audio&&audio.state==='suspended')audio.resume();
   load();if(!msgs.length)return;
 run++;cur=run;paused=false;$('#pause').textContent='Pause';resetUI();
 try{await sleep(500);for(const m of msgs){m.r==='u'?await userTurn(m.t):await gptTurn(m.t)}await sleep(600);zoom('wide')}catch(e){}}
$('#play').onclick=play;
$('#load').onclick=load;
$('#rst').onclick=()=>{run++;cur=run;paused=false;$('#pause').textContent='Pause';resetUI()};
$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'Resume':'Pause'};
const tg=$('#tg'),pn=$('#panel');
function tgl(){pn.classList.toggle('hide');const h=pn.classList.contains('hide');tg.textContent=h?'Show panel':'Hide panel';tg.setAttribute('aria-expanded',!h)}
tg.onclick=tgl;
addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='p'||e.key==='P')tgl();if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();$('#pause').click()}});
[['ts','v1'],['rs','v2'],['th','v3'],['hd','v4']].forEach(([a,b])=>{const f=()=>$('#'+b).textContent=$('#'+a).value;$('#'+a).oninput=f;f()});
load();
</script></body></html>
